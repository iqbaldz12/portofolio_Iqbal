<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Portofolio Iqbal</title>
    <script type="text/javascript">
      // SPA fallback untuk GitHub Pages (static hosting).
      // GitHub Pages mengembalikan 404.html untuk path yang tidak ada file-nya.
      // Script ini menyimpan path asli ke query string lalu redirect ke index.html,
      // dan index.html akan mengembalikannya ke URL semula.
      // pathSegmentsToKeep = 1 karena situs berada di subfolder "/portofolio_Iqbal/".
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
